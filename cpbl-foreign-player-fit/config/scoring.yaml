# CPBL Foreign Player Fit POC — single source of truth for every tunable choice.
#
# PRE-REGISTRATION NOTE
# The `baseline` and `fit` weights below were committed to git BEFORE any
# candidate ranking was computed (see git history of this file). They must not
# be edited to favour a particular player. Sensitivity analyses live in
# `evaluate.py` and perturb these weights instead of replacing them.

snapshot_date: "2026-10-13"   # nothing dated after this is used

paths:
  raw: data/raw
  processed: data/processed
  reports: reports
  figures: figures
  external: ../../ext          # scratch clones (Retrosheet, Chadwick register, chadwick tools)

sources:
  rebas_release: "https://github.com/rebas-tw/rebas.tw-open-data/releases/download"
  rebas_seasons: {2024: "v0.1.0-2024", 2025: "v0.1.0-2025"}
  milb_release: "https://github.com/armstjc/milb-data-repository/releases/download"
  milb_pbp_months:
    2024: [3, 4, 5, 6, 7, 8, 9]
    2025: [3, 4, 5]            # mirror stopped publishing pitch-level files after 2025-05
  milb_game_months:
    2025: [3, 4, 5]
    2026: [4, 5, 6, 7, 8, 9]
  milb_season_years: [2025, 2026]
  # AMENDMENT 1 (2026-10-13, committed before any amended ranking was computed):
  # statsapi.mlb.com became reachable. The mirror's pitch-level gap (2025-05-26 onward
  # and all of 2026) is filled from the official game feed. The windows overlap the
  # mirror by a few days so cross-source consistency can be tested; duplicates are
  # dropped on (game_pk, at_bat_number, pitch_number), mirror rows kept first.
  statsapi_pbp_windows:
    2025: ["2025-05-20", "2025-09-30"]
    2026: ["2026-03-20", "2026-09-30"]
  retrosheet_repo: "https://github.com/chadwickbureau/retrosheet"
  register_repo: "https://github.com/chadwickbureau/register"
  chadwick_tarball: "https://github.com/chadwickbureau/chadwick/releases/download/v0.10.0/chadwick-0.10.0.tar.gz"

eligibility:
  seasons: [2024, 2025]
  hitter_max_pa: 200           # inclusive: exactly 200 PA is eligible
  pitcher_max_ip: 40           # inclusive: exactly 40.0 IP (120 outs) is eligible

units:
  kmh_per_mph: 1.609344

# Pitch-type harmonisation. REBAS codes are hand-tagged from broadcast video;
# Statcast codes come from MLBAM's classifier. Both are mapped onto this
# common vocabulary; finer distinctions (ST vs SL, KC vs CU) do not exist on
# the CPBL side and are therefore collapsed.
pitch_map:
  common:
    FF: FF
    FA: FF
    SI: SI
    FT: SI
    FC: FC
    SL: SL
    ST: SL
    SV: SL
    CU: CU
    KC: CU
    CS: CU
    CH: CH
    FS: SPL
    FO: SPL
    SC: CH
  group:            # coarse fallback (Go/No-Go level 1)
    FF: "FB"
    SI: "FB"
    FC: "FB"
    SL: "BRK"
    CU: "BRK"
    CH: "OFF"
    SPL: "OFF"

velocity_bands_mph:          # four-seam / sinker velocity bands for the hitter partition
  edges: [0, 88, 91, 94, 200]
  labels: ["<88", "88-91", "91-94", "94+"]

samples:
  min_cell_pitches_env: 400    # environment cells below this are merged / flagged
  shrink_k_whiff_swings: 60    # beta-binomial prior strength for player whiff% (swings)
  shrink_k_woba_pa: 80         # prior strength for player wOBA splits (PA)
  shrink_k_env_swings: 300     # prior strength for environment whiff contrasts
  shrink_k_platoon_pa: 500     # platoon splits regress heavily (Tango: ~1000 PA); conservative middle
  recent_shrink_bf: 60         # recent-form rates shrunk toward the player's own season rate
  min_pitcher_tracked_pitches: 400
  min_hitter_tracked_pa: 150
  # AMENDMENT 1: player pitch-level profiles use the two most recent complete AAA
  # seasons; the CPBL-vs-AAA environment compares the SAME seasons on both sides
  # (CPBL REBAS only covers 2024-25). Thresholds above are unchanged.
  player_seasons: [2025, 2026]
  env_seasons: [2024, 2025]

# AAA has two leagues with very different run environments (PCL >> IL). Baseline
# rate stats are expressed relative to the player's league(s) average, PA/BF-weighted.
league_adjust: true

candidate_filters:
  pitcher:
    season: 2026
    min_gs: 10
    min_ip: 60
  hitter:
    season: 2026
    min_pa: 300

# wOBA linear weights. The same generic weights are applied to BOTH leagues so
# that differences reflect outcomes, not weight choices (FanGraphs 2024 MLB
# scale, rounded). Absolute levels are therefore "wOBA-like", not official.
woba_weights:
  uBB: 0.69
  HBP: 0.72
  1B: 0.89
  2B: 1.27
  3B: 1.62
  HR: 2.10

baseline:
  winsor_z: 2.5               # z-scores clipped so one extreme stat cannot dominate
  # AMENDMENT 5 (2026-10-13; Johnny's choice "K%+BB% 分開"): the pitcher baseline is rebuilt
  # around strikeout ability, because CPBL hitters make contact (whiff% 19.4% vs AAA 24.8%).
  # Chosen after a check of 2025 vs 2026 AAA (statsapi totals, 178 pitchers with >= 150 BF in
  # both seasons; no candidate ranking involved): year-to-year Spearman K% 0.42, BB% 0.53,
  # K-BB% 0.12, K/BB 0.17, FIP 0.11; same-season Spearman with ERA K% -0.40, BB% +0.16,
  # K-BB% -0.53, FIP +0.72. K% and BB% are each stable; their difference is not. Weights are
  # judgment (K% leads, FIP supports); amendment 4's estimate is still computed for these
  # metrics and reported, but not used for pitchers (weights_source below).
  # Previous pitcher spec (amendments 0-4): K-BB% 0.40, FIP 0.25, recent K-BB% 0.15,
  # IP/GS 0.10, GS 0.10 (git history).
  pitcher:                    # sign: +1 higher is better, -1 lower is better
    k_pct_adj:       {weight: 0.50, sign: 1}    # SO / BF minus league SO / BF
    bb_pct_adj:      {weight: 0.25, sign: -1}   # BB / BF minus league BB / BF
    fip:             {weight: 0.25, sign: -1}
  hitter:
    woba:            {weight: 0.40, sign: 1}
    iso:             {weight: 0.20, sign: 1}
    bb_pct:          {weight: 0.15, sign: 1}
    k_pct:           {weight: 0.15, sign: -1}
    recent_woba:     {weight: 0.10, sign: 1}
  recent_window: ["2026-08-01", "2026-09-30"]
  # AMENDMENT 4 (2026-10-13; committed BEFORE the estimated weights, or any ranking that uses
  # them, were computed or viewed). The weights above were set by judgment. From now on the
  # baseline uses weights estimated from data (src/baseline_weights.py docstring): which mix of
  # the SAME metrics in 2025 AAA best predicts next-season (2026) AAA quality. Metrics, signs,
  # league adjustment, clipping and the 0.7 / 0.3 combination are unchanged; no metric is added.
  # The judgment weights stay as the fallback and are reported next to the new ranking
  # (baseline_rank_judgment). The weight perturbation in Test B perturbs the weights in use.
  # Nothing about the estimated weights was looked at before this registration; only the fact
  # that the mirror's 2025 season file stops in May (so 2025 comes from statsapi) was checked.
  weights_source: {pitcher: judgment, hitter: estimated}   # amendment 5; amendment 4 had "estimated" for both
  estimation:
    predictor_season: 2025
    target_season: 2026
    recent_window: ["2025-08-01", "2025-09-30"]     # same calendar window as the 2026 recent form
    source: statsapi season and byDateRange stats, sportId 11, gameType R, both seasons
    sample: 2025 AAA players passing candidate_filters workload (any MLB status)
    target_min: {pitcher: 150, hitter: 150}        # 2026 AAA BF / PA
    target:
      pitcher: "-(FIP - league FIP), 2026 AAA, league mix as in the baseline"
      hitter: "wOBA - league wOBA, 2026 AAA, generic woba_weights"
    method: weighted NNLS on centred sign-aligned clipped z-scores (z within the sample), player
      weight = 2026 BF / PA, coefficients rescaled to sum to 1
    min_n: 40                    # fewer players with a target -> judgment weights
    cv_folds: 10                 # reported only: CV Spearman of estimated vs judgment weights
    bootstrap: {draws: 1000, ci: 0.90, seed: 20261013}

# AMENDMENT 5 (2026-10-13; committed BEFORE any park-adjusted ranking was computed or viewed).
# Johnny: a player's home park is half of his games, so hitter / pitcher parks must be
# accounted for. Park factors per AAA club and event (src/park.py docstring) are estimated
# from 2025-26 AAA plate appearances (home vs road games of each club, regressed by
# method-of-moments reliability, PA-weighted mean 1). Only the factors themselves were
# looked at before this registration (e.g. HR: CLT 1.52, LV 1.47, NAS 0.69). Every AAA
# counting stat is divided by (PF + 1) / 2 of the club it was compiled with (season totals,
# the statsapi tables behind amendment 4) or, game by game, by PF in home games (game logs:
# recent form, bootstrap). League adjustment, z-scores, the amendment-4 estimation and the
# D7 road-only check (road games are not adjusted) all run on the adjusted numbers.
# Fit (pitch-level shape) is not park-adjusted.
park:
  enabled: true
  seasons: [2025, 2026]
  events: [SO, uBB, HBP, 1B, 2B, 3B, HR]
  player_factor: half_home    # (PF_home + 1) / 2 per club stint

fit:
  pitcher:
    # F1: extra whiffs per 100 swings explained by CPBL-specific pitch-type weakness
    # F2: wOBA-allowed shift from the pitcher's PA-ending pitch mix
    components: {mix_whiff: 0.6, mix_damage: 0.4}
  hitter:
    # All hitter components are in the same unit (expected wOBA change), so they
    # are summed without subjective weights; the weights below only exist so the
    # sensitivity test can perturb them.
    components: {pitch_mix: 1.0, velocity: 1.0, hand: 1.0}
  # AMENDMENT 3 (2026-10-13; committed BEFORE any Fit score, ranking or backtest result
  # under this method was computed). Test D1 found that CPBL's per-cell contrasts mix
  # hitter reaction with WHO throws each pitch. An exploratory check run before this
  # registration (pitcher fixed-effect logits of whiff by cell vs FB91-94, CPBL vs AAA
  # 2024-25, no location term) was seen: SL -0.23 -> -0.13, CU -0.24 -> -0.14,
  # SPL -0.19 -> -0.01, FB94+ +0.16 -> +0.03 (pooled -> within). Nothing else was computed.
  # From now on both environment contrasts are estimated within pitcher AND location
  # (in zone / out of zone / unknown), per league, then centred exactly as before
  # (fit_score.py docstring). F1/F2 formulas, weights, thresholds and the pick rule are
  # unchanged. The rankings, bootstrap, weight perturbation, Tests A-D and the amendment-2
  # backtest (same rules) are all re-run with this environment; the pooled-environment
  # results stay in git history (merge 30f89ea) and are reported next to the new ones.
  environment_method: within_pitcher   # was implicitly "pooled"
  within_pitcher:
    min_swings: 100            # a pitcher enters the whiff model with >= 100 swings in the window
    min_pa: 50                 # ... and the damage model with >= 50 PA ended by a tracked pitch
  combined_heuristic:          # ONLY used for the illustrative "overall" column
    baseline: 0.7
    fit: 0.3
  weight_grid: [[1.0, 0.0], [0.8, 0.2], [0.7, 0.3], [0.5, 0.5]]

evaluation:
  bootstrap_reps: 300
  random_seed: 20261013

# AMENDMENT 1: recruitment feasibility. Facts only, from the official MLB Stats API
# as of the snapshot date (40-man roster membership of all 30 MLB clubs, 2026 MLB
# appearances, transaction log). Never enters any score. The recommendation rule is
# unchanged (pitcher: combined 0.7/0.3 rank among Fit-available; hitter: baseline
# rank, Fit only if its 2025-vs-2026 reliability rho >= 0.30), except that the
# PRIMARY pick is the best-ranked candidate NOT on an MLB 40-man roster at the
# snapshot; the best-ranked candidate overall is always shown next to it.
recruitment:
  as_of: "2026-10-13"
  primary_pick_excludes_40man: true
  hitter_fit_min_reliability: 0.30

# AMENDMENT 2 (2026-10-13; committed BEFORE any backtest outcome was computed or viewed):
# backtest of the PITCHER Fit against foreign pitchers' actual CPBL results.
# While building the cohort only CPBL batters-faced counts, first-appearance dates and
# throwing hand were looked at, never a CPBL rate stat. Identities (REBAS Chinese name ->
# English name -> MLBAM id) come from news reports + the MLB Stats API people search and
# are listed with a source per row in data/reference/cpbl_foreign_pitchers.csv.
# Nothing here enters the 2026 rankings; no backtest outcome changes the picks.
backtest:
  reference: data/reference/cpbl_foreign_pitchers.csv
  outcome_seasons: [2024, 2025]       # the REBAS span
  aaa_window_days: 365                # AAA tracked pitches in the 365 days BEFORE the pitcher's
                                      # first CPBL appearance of the outcome season
  aaa_extra_windows:                  # AAA 2023 fetched only for this backtest (statsapi feed)
    2023: ["2023-03-28", "2023-09-30"]
  min_aaa_tracked_pitches: 400        # = samples.min_pitcher_tracked_pitches
  min_cpbl_bf: 60
  one_season_per_pitcher: earliest    # a pitcher eligible in both seasons counts once
  identity_check: throwing hand in AAA window must equal REBAS hand, else excluded
  environment: leave_season_out       # outcome 2025 -> CPBL 2024 vs AAA 2024; outcome 2024 -> 2025 vs 2025
  fit_z: within_cohort                # Fit = 0.6 z(F1) + 0.4 z(F2), z over the pooled cohort
  outcomes:                           # same definitions on both sides (pitch-level data)
    whiff: whiffs / swings, bunts excluded
    k_minus_bb_pct: (SO - uBB) / PA
    woba_allowed: generic woba_weights, IBB/SH/CI excluded from the denominator
  hypotheses:
    H1: "primary: Spearman(F1 mix_whiff, CPBL whiff% - AAA whiff%) > 0"
    H2: "Spearman(F2 mix_damage, CPBL wOBA - AAA wOBA) < 0"
    H3: "Spearman(Fit, residual of CPBL K-BB% after OLS on AAA K-BB%) > 0"
    reference: "Spearman(AAA K-BB%, CPBL K-BB%) and Spearman(0.7 z(AAA K-BB%) + 0.3 Fit, CPBL K-BB%)"
  bootstrap: {draws: 2000, ci: 0.90, seed: 20261013}   # resample pitchers
  min_n_for_conclusion: 15            # below this every result is reported as descriptive only
  # Reporting rule: if H1's 90% CI lies entirely below 0, recommendations.md says the
  # backtest contradicts Fit; if it lies entirely above 0 it says the backtest supports it;
  # otherwise "inconclusive". The 2026 picks are not changed by any outcome.

# AMENDMENT 6 (2026-10-14; committed BEFORE any amendment-6 ranking, tier table or recruitment
# backtest was computed or viewed). Johnny asked to make the ranking closer to how CPBL clubs
# actually recruit and chose "可簽性＋擴池" after a Codex (gpt-6-astra) discussion. Already
# seen before this registration (exploratory, outside the repo): the 34 import pitchers CPBL
# clubs signed for 2026 (public news) re-ranked with the amendment-5 rules on 2025 AAA only;
# the six with a 2025 AAA starter workload ranked 44, 84, 89, 94, 105 and 112 of 122, and the
# top of that list was MLB prospects. Sample transaction histories of those six and of a few
# 2026 candidates were also read (all six "elected free agency" on 2025-11-06).
# Nothing here uses 2026 CPBL data.
#
# 1. Pool: two AAA seasons instead of one. Ability metrics are computed on both seasons'
#    counting stats pooled (park-adjusted per club stint, statsapi per-club tables as in
#    amendment 4); each player's league average is his BF / PA-weighted mix of the season x
#    league averages, so the metric equals the BF / PA-weighted mean of the per-season
#    league-adjusted metrics. Recent form (hitters) stays the 2026 Aug-Sep window. The
#    amendment-4/5 weights are NOT re-estimated. The bootstrap resamples games of both
#    seasons (2025 per-game lines from the statsapi gameLog, park-adjusted like the 2026
#    mirror logs). The MLB-eligibility screen (contest rule) is unchanged. The old one-season
#    ranking is reported next to the new one.
# 2. Signability tiers from statsapi transactions and 40-man rosters (src/signability.py).
#    Only transactions to or from an affiliated club (MLB, AAA-Rookie) count; winter-league
#    and foreign-league assignments are ignored.
#      T4_40man      on a 40-man roster on as_of
#      T1_free       not on a 40-man; latest affiliated status event is "Declared Free Agency"
#                    or "Released" (nothing that re-establishes control after it)
#      T2_expiring   still controlled, and either his latest affiliated signing is a free-agent
#                    minor-league signing ("Signed as Free Agent"; such contracts normally end
#                    with the season) or his first professional season is <= as_of year - 6
#      T3_controlled every other non-40-man player
#    Signable = T1 + T2. The primary pick is the best-ranked signable candidate (replaces the
#    amendment-1 "not on a 40-man" rule, which is still reported). The T2 rule is checked once
#    on 2025: tiers as of 2025-10-13 vs who actually became a free agent or was released
#    between 2025-10-14 and 2025-11-30 (precision, recall; reported, nothing tuned).
# 3. Recruitment backtest (src/recruitment_backtest.py), pitchers only, descriptive only.
#    Ability = amendment-5 baseline (K% .50, BB% .25, FIP .25) on the fold's seasons, park
#    factors re-estimated from the fold's own seasons; no Fit and no MLB-eligibility screen in
#    either arm (the contest rule is season-specific). Two arms per fold:
#      old: one-season pool (latest season GS >= 10 & IP >= 60), drop 40-man players
#      new: two-season pool (rule 1) + signable tiers (rule 2), same as_of
#    Fold A (primary): as_of 2024-10-13, seasons 2023-24; positives = pitchers whose first
#      REBAS season is 2025 (data/reference/cpbl_foreign_pitchers.csv).
#    Fold B (exploratory, its 2025 ranks were already seen): as_of 2025-10-13, seasons
#      2024-25; positives = data/reference/cpbl_imports_2026_news.csv minus REBAS 2024-25.
#    Reported per arm: list size N, positives in list n, hits@10 and @20 with the random
#    expectation k*n/N, coverage (positives in list / positives with any AAA pitch in the
#    fold's seasons), median percentile rank of positives. Overlap only measures how much the
#    list resembles what clubs did, not whether the picks are better; no outcome changes the
#    method or the picks.
amendment6:
  pool:
    seasons: [2025, 2026]
    pitcher: {min_gs: 10, min_ip: 60, latest_min_ip: 20}
    hitter: {min_pa: 300, latest_min_pa: 100}
  signability:
    as_of: "2026-10-13"
    affiliated_sport_ids: [1, 11, 12, 13, 14, 16]
    free_events: [DFA, REL]                   # Declared Free Agency, Released
    control_events: [SFA, SGN, CLW, TR, SE, OUT, OPT, CU, DES]
    expiring_signing: SFA
    expiring_years: 6
    signable: [T1_free, T2_expiring]
    t2_check: {as_of: "2025-10-13", until: "2025-11-30"}
  backtest:
    role: pitcher
    folds:
      A: {as_of: "2024-10-13", seasons: [2023, 2024], positives: rebas_first_2025, primary: true}
      B: {as_of: "2025-10-13", seasons: [2024, 2025], positives: news_2026, primary: false}
    ks: [10, 20]

# AMENDMENT 7 (2026-10-14; committed BEFORE any 2026 CPBL rate statistic of the cohort was
# parsed, computed or viewed). Johnny reversed the 2026-10-14 decision "no unlicensed 2026
# data" for ONE use: 2026 CPBL first-team regular-season stats of import players, taken from
# stats.cpbl.com.tw (CPBL's Trackman-based advanced-stats site), serve as BACKTEST OUTCOMES.
# The site's terms (使用條款 §4) require written authorization; it is used without one at
# Johnny's decision and this is disclosed in reports/limitations.md (L10) and data/sources.md.
# Access: never /api/ (robots.txt); public player pages as Markdown (the site's documented AI
# path, `Accept: text/markdown`) for identities only; the stats come from Johnny's in-browser
# "匯出表單" export of the 2026 一軍例行賽 PR table (pitchers and batters). The export is not
# redistributed; only cohort-level derived numbers are. No 2026 CPBL number enters the 2026
# ranking or changes the picks.
# Already seen before this registration: names, team, first/second-team level and the PA count
# of each player page's default view (517 pages read for identities); one 2026 line quoted in
# the Q&A thread (Mario Sanchez: K% 20.2, BB% 2.9, whiff% 21.3, wOBA allowed .292).
#
# Identity: an "import" is a player of the export whose MLBAM id is found (statsapi people
# search on the site's original name / news name) and whose birth country is not Taiwan; the
# mapping is listed with a source per row in data/reference/cpbl_imports_2026_site.csv. A
# pitcher's AAA throwing hand must equal the site's hand.
#
# Pitchers: pooled cohort = amendment-2 cohort (2024-25 arrivals, REBAS outcomes, unchanged
#   screening) + 2026 cohort: import pitchers with >= 400 tracked AAA pitches in the 2025
#   regular season and >= 60 CPBL 2026 first-team BF. A pitcher counts once (earliest season).
#   Predictors (AAA, before arrival):
#     baseline  amendment-5 pitcher score (K% .50, BB% .25, FIP .25; league- and park-adjusted)
#               on the AAA season preceding the outcome season (2023 / 2024 / 2025), z against
#               all AAA pitchers of that season with >= 100 BF; park factors from that season
#               and the next (park.factors_for([Y, Y+1])). Needs >= 100 AAA BF that season.
#     K%, BB%   league-adjusted, same season
#     F1, F2, Fit  as amendment 2; for 2026 the AAA window is the 2025 regular season and the
#               environment is CPBL 2024-25 vs AAA 2024-25; Fit z over the pooled cohort.
#   Outcomes: CPBL K%, BB%, K-BB%, whiff% (REBAS for 2024-25, the export for 2026), each
#   centred on its season's league value (REBAS all pitchers for 2024-25; BF-weighted mean of
#   all pitchers in the export for 2026).
#   Tests (Spearman, 90% bootstrap CI over pitchers, verdict rule and min n as amendment 2):
#     P1 (primary)  baseline vs centred CPBL K-BB%              expected +
#     P2            AAA K% vs centred CPBL K%                   +
#     P3            AAA BB% vs centred CPBL BB%                 +
#     P4            Fit vs residual of centred CPBL K-BB% after OLS on baseline   +
#     P5            F1 vs (centred CPBL whiff% - AAA window whiff% centred on its season)  +
#   Descriptive: P1 within the 2026 cohort and within the amendment-2 cohort.
# Hitters (first hitter backtest; 2026 only): import non-pitchers with >= 150 AAA PA in 2025
#   and >= 100 CPBL 2026 first-team PA.
#   Predictors on 2025 AAA (park- and league-adjusted, recent window 2025-08-01..09-30), z
#   against all 2025 AAA non-pitchers with >= 150 PA: baseline score with the amendment-4
#   estimated weights (in use), the judgment-weight score, AAA K%, ISO, wOBA.
#   Outcomes: CPBL 2026 wOBA, K%, ISO from the export (site definitions; one season, so
#   ranks only).
#   Tests: Q1 (primary) estimated-weight baseline vs CPBL wOBA +; Q2 judgment-weight baseline
#   vs CPBL wOBA +; Q3 AAA K% vs CPBL K% +; Q4 AAA ISO vs CPBL ISO +; Q5 AAA wOBA vs CPBL wOBA +.
# Reporting rule: as amendment 2 (supports / contradicts / inconclusive from the 90% CI;
# below 15 players everything is descriptive only). No outcome changes the method or picks.
amendment7:
  source: stats.cpbl.com.tw export, 2026 一軍例行賽 PR table (pitchers, batters)
  identities: data/reference/cpbl_imports_2026_site.csv
  pitcher:
    outcome_season: 2026
    aaa_season: 2025
    min_aaa_tracked_pitches: 400
    min_cpbl_bf: 60
    baseline_min_bf: 100
    env_seasons: [2024, 2025]
  hitter:
    aaa_season: 2025
    min_aaa_pa: 150
    min_cpbl_pa: 100
    recent_window: ["2025-08-01", "2025-09-30"]
  bootstrap: {draws: 2000, ci: 0.90, seed: 20261014}
  min_n_for_conclusion: 15

# AMENDMENT 7b (2026-10-14; Johnny added items 3 and 4; committed BEFORE any velocity table was
# parsed and before any 2026 CPBL rate statistic of the cohort was seen). Already seen: one
# page's 2026 velocity table (Mario Sanchez: 快速球 avg 145.8 km/h, 變化球 129.4 km/h).
# Same source rules as amendment 7 (public pages as Markdown, Johnny's exports, no /api/).
# Both items are descriptive; neither changes the ranking, the picks or any registered test.
#
# Item 3, AAA -> CPBL translation (pitchers, the amendment-7 pooled cohort):
#   AAA K%, BB% = park-adjusted raw rates of the season preceding arrival (statsapi stints);
#   AAA whiff% = amendment-2 window (2025 season for 2026 arrivals). CPBL K%, BB%, whiff% =
#   REBAS (2024-25) or the site export (2026), not centred.
#   Reported per metric: league ratio (CPBL league / AAA league of the matching seasons), OLS
#   CPBL = a + b * AAA over the cohort with 90% bootstrap CI for a, b (2000 draws over
#   pitchers, seed below), and the translated CPBL value at AAA K% 20/25/30%, BB% 6/8/10%,
#   whiff% 22/26/30%. Survivorship (only pitchers clubs kept for >= 60 BF) is disclosed.
# Item 4, REBAS broadcast velocity vs site Trackman:
#   Pitchers with >= 100 REBAS 2025 fastballs (FF + SI, velocity present) and a 2026 一軍例行賽
#   "快速球" row with >= 100 pitches on the site (player page default view, or Johnny's export
#   of the 球種x球速轉速 table). Joined on the display name with leading #/* removed; names that
#   are not unique on either side are dropped.
